<mat-nav-list role="navigation" class="mat-nav-list mat-list-base" style="display: flex;height: 150px;justify-content: center;align-items: center;text-align: center; padding: 0 !important;">
    <a target="_blank" [href]="contactPerson.chatUrl" mat-ripple class="mat-focus-indicator mat-2-line mat-ripple hover-cls" style="border-right: 1px solid #EAEAEA; height:150px; display: flex; justify-content: center; width:100%;">
        <div class="">
            <div class=""></div>
            <div class="" style="height: 150px;">
                <div style="text-align: center;justify-content: center;display: flex;">
                    <img src="/assets/png/hi-logo.png" height="60" width="60" style="position: relative; top:15px;"/>
                </div>
                <span class="mat-line" mat-line="" style="position: relative; top:25px;">Start Hi Chat With</span><br>
                <span class="mat-line" mat-line style="font-weight: bold; position: relative; top:25px;">
                    {{ contactPerson.fullName || contactPerson.firstName + ' ' + contactPerson.lastName }}
                </span>
            </div>
        </div>
    </a>
    <a mat-ripple [href]="'mailto:' + contactPerson.mail" class=" mat-focus-indicator mat-2-line hover-cls" style="height:150px; display: flex; justify-content: center; width:100%;">
        <div class="">
            <div style="text-align: center;display: flex;"></div>
            <div class="" style="height: 150px;">
                <div style="text-align: center;justify-content: center;display: flex;">
                    <img src="/assets/png/outlook-logo.png" height="60" width="60" style="position: relative;top:15px;"/>
                </div>
                <span mat-line="" class="mat-line" style="position:relative; top:25px;">Send Mail To Owner</span><br>
                <span mat-line="" class="mat-line" style="font-weight: bold; position: relative; top:25px;">{{ contactPerson.fullName }}</span>
            </div>
        </div>
    </a>
</mat-nav-list>

<!doctype html>
<html lang="en">
<head>
  <!-- Piwik -->
  <script type="text/javascript" id="paqId">
    function getCookie(name) {
      const ca = document.cookie.split(';');
      const caLen = ca.length;
      const cookieName = `${name}=`;
      let c;

      for (let i = 0; i < caLen; i+= 1) {
        c = ca[i].replace(/^\s+/g, '');
        if (c.indexOf(cookieName) === 0) {
          return c.substring(cookieName.length, c.length);
        }
      }

      return '';
    }

    let b64DecodeUnicode = str =>
        decodeURIComponent(
          Array.prototype.map.call(atob(str), c =>
              '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
          ).join(''));
      
    let parseJwt = token => {
      if (token) {
        return (JSON.parse(b64DecodeUnicode(
          token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')
        )))
      }
    }

    const user = parseJwt(getCookie('authorization'));
    if (user) {
      var _paq = _paq || [];
      const fullName = ((user.name && user.name.firstName && user.name.lastName) ? user.name.firstName + ' ' + user.name.lastName : user.displayName) + ' - ' + user.adfsId;
      _paq.push(["setCustomVariable", 1, "username", user.displayName, "visit"]);
      _paq.push(["setUserId", fullName]);
      _paq.push(["trackPageView"]);
      _paq.push(["enableLinkTracking"]);
      (function () {
        var u = "https://spike.matomo.cloud/";
        _paq.push(['setTrackerUrl', u + 'matomo.php']);
        _paq.push(['setSiteId', '1']);
        var d = document, g = d.createElement('script'), s = d.getElementById('paqId');
        g.type = 'text/javascript'; g.async = true; g.defer = true; g.src = '//cdn.matomo.cloud/spike.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g, s);
      })();
    }
  </script>

  <meta charset="utf-8">
  <title>Spike</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
